<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Video</title>
    <!--
        =====================================================
        YouTube 영상 임베드 페이지
        iframe을 이용해 외부 YouTube 영상을 페이지에 삽입
        =====================================================
    -->
</head>
<body>
    <!-- 
    &autoplay=1: 자동재생 
    &mute=1: 음소거
      -->


    <!--
        =====================================================
        iframe으로 YouTube 영상 삽입
        =====================================================
        iframe: 다른 웹 페이지를 현재 페이지 안에 인라인으로 끼워 넣는 태그
        src: 삽입할 페이지의 경로를 지정하는 속성. embed 주소 뒤에 ? 와 &로 옵션 쿼리 파라미터를 이어붙여 영상 재생 방식을 제어할 수 있음
        autoplay=1: 자동 재생
        mute=1: 음소거. 

        title: 스크린리더 등 접근성 도구에서 읽어주는 영상 제목
        frameborder: 프레임 테두리 두께 (0이면 테두리 없음, CSS로 대체할 수 있음)
        allow: iframe 내부 콘텐츠에서 사용을 허용할 브라우저 기능 목록을 지정하는 속성
        allowfullscreen: 영상을 전체화면으로 전환할 수 있게 허용하는 속성
        referrerpolicy: 요청 시 Referer 헤더에 담길 출처 정보의 범위를 제어하는 속성
    -->
    <iframe width="560" height="315" src="https://www.youtube.com/embed/rFjRsWPGZxY?si=wZc3KL6Nd1VTb8IK&autoplay=1&mute=1" title="YouTube video player" frameborder="0" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share" referrerpolicy="strict-origin-when-cross-origin" allowfullscreen></iframe>
</body>
</html>
