<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ATag</title>
    <!--
        =====================================================
        A Tag - 링크 버튼 / iframe 삽입 / 미구현 링크 처리
        <a> 태그 스타일 버튼 구성, iframe 연동, javascript:void(0) 사용법 실습
        =====================================================
    -->
    <style>
        /* CSS */

        /* --- 공통 버튼 스타일 --- */ 
        .btn{
            display: inline-block;
            /* width: 120px; */         /* 고정 width → 텍스트 길이에 따라 레이아웃 깨짐. padding으로 대체 */
            height: 30px;
            padding: 0 10px;            /* 좌우 padding으로 버튼 너비를 텍스트에 맞게 유동 확장 */
            line-height: 30px;          /* height와 동일값 → 텍스트 수직 가운데 정렬 */
            text-align: center;
            text-decoration: none;      /* <a> 기본 밑줄 제거 */
            margin: 5px;
            border-radius: 5px;         /* 모서리 둥글게 처리 */
            font-size: .8rem;           
            background-color: lightgray;
            color: white;
            box-shadow: 2px 2px 2px lightgray;
            opacity: .5;                /* 기본 상태: 반투명 */
        }                
        
        /* --- hover 인터랙션 --- */
        /* :hover : 마우스를 요소 위에 올렸을 때 적용되는 가상 클래스 */
        .btn:hover{
            opacity: 1;                 /* 마우스 호버 시 불투명으로 전환 */
        }

        /* --- 버튼 색상 개별 지정 --- */
        .btn-1{background-color: darkblue;}
        .btn-2{background-color: blue;}
        .btn-3{background-color: green}
    </style>
</head>
<body>
    <!-- 
        =====================================================
        <a> 태그 - 링크 버튼
        ===================================================== 

        .btn 공통 스타일에 .btn-N 색상 클래스를 중복 적용해 버튼을 구성한다.
        href: 이동할 URL 또는 파일 경로를 지정하는 속성 
        target: 링크를 열 위치를 지정하는 속성. _self: 현재 탭(기본값) / _blank: 새 탭 
    -->

    <a class="btn btn-1" href="./02Basic.html">문서이동-1</a>
    <a class="btn btn-2" href="./02Basic.html" target="_blank">문서이동-2</a> <!-- _blank: 새탭열기 -->
    <a class="btn btn-3" href="https://naver.com" target="_blank">NAVER</a>
    <hr/>
    <!-- 
        =====================================================
        iframe - 외부 문서 삽입
        ===================================================== 
    -->
    <!-- 
        <a>의 target 속성값을 iframe의 name에 작성하면 해당 iframe 안에서 링크가 열린다.
        name: iframe을 식별하는 이름. <a>의 target과 연결하는 데 사용 
        src: 초기 로드할 URL. 빈 값이면 빈 상태로 시작 
        frameborder: 테두리 표시 여부. 0: 없음 / 1: 있음 (HTML5에서는 CSS border 사용 권장) 
        - 보안 이슈로 잘 쓰지 않음. naver 등은 삽입을 차단한다.  
    -->

    <p><a href="https://www.daum.net" target="frm1">DAUM으로 이동</a></p>
    <iframe name="frm1" src="" frameborder="1" width="500px" height="500px"></iframe>

    <hr/>

    <!-- 
        =====================================================
        javascript:void(0) - 미구현 링크 처리
        ===================================================== 

        href=""를 비워두면 현재 페이지가 새로고침된다. 기능 미구현 상태임을 명시하려면 javascript:void(0)를 사용한다.
        javascript:void(0): 아무 동작도 수행하지 않는 빈 링크 표시. 충돌 및 새로고침 방지
    -->

    <a href="javascript:void(0)">FUNCTION1</a>  <!-- 미구현 링크: 아무 동작 없음 -->
    <a href="">FUNCTION2</a>                     <!-- 빈 href: 현재 페이지 새로고침 발생 -->

</body>
</html>
