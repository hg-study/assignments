<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>

    <!--
        =====================================================
        회원가입 폼 페이지 - 스타일 적용
        =====================================================
        아이디 / 비밀번호 / 이름 / 주소 / 연락처 / 이메일 / 생년월일 섹션으로 구성된
        회원가입 폼에 row 기반 flex 레이아웃과 버튼 스타일을 적용한 페이지
    -->

    <style>

        * {
            box-sizing: border-box; /* padding/border를 width/height 안쪽으로 포함시켜 계산 */
        }

        body {
            margin: 0;
            padding: 0;
        }

        /* --- input 공통 스타일 --- */
        input {
            height: 100%;           /* 부모 .row의 height에 맞춤 */
            outline: none;          /* 포커스 시 기본 테두리 제거 */
            border-radius: 0;       /* 브라우저 기본 둥근 모서리 제거 */
            border: 1px solid gray;
            padding-left: 10px;     /* 입력 텍스트가 테두리에 안 붙도록 좌측 여백 */
        }

        /* text/password 타입만 너비 100%로 확장 */    
        input[type="text"],
        input[type="password"] {
            width: 100%;
        }
        
    </style>

</head>

<body>
    <!--
        =====================================================
        form 태그 & method 속성
        =====================================================
        form : 사용자로부터 특정 정보를 받아 서버로 전달하는 데 사용되는 태그
        action Attribute : 전달받는 서버 URI
        method Attribute : 서버로 요청하는 방식
            - GET    : 사용자 요청 정보를 Query String으로 전달 (Default)
            - POST   : 사용자 요청 정보를 Request body(Payload)로 전달
            - PUT    : 리소스 전체를 새 데이터로 교체(덮어쓰기)할 때 사용
            - PATCH  : 리소스의 일부 데이터만 수정할 때 사용
            - DELETE : 리소스를 삭제할 때 사용
    -->

    <form action="/test.jsp" method="get">
        <div>
            <h2>회원가입</h2>
        </div>
        <!-- 
            === 아이디 중복확인 === 
            (href="javascript:void(0)": 페이지 이동 없이 클릭 이벤트만 발생시키는 더미 링크) 
        -->
        <div class="row">
            <label>아이디</label>
            <input name="userid" type="text" />
            <a class="btn" href="javascript:void(0)">중복확인</a>
        </div>
        <div class="row">
            <label>비밀번호</label>
            <input name="password" type="password" />
        </div>
        <div class="row">
            <label>비밀번호 확인</label>
            <input name="re-password" type="password" />
        </div>
        <div class="row">
            <label>이름</label>
            <input name="username" type="text" />
        </div>
        <div class="row">
            <label>우편번호</label>
            <input name="zipcode" type="text" />
            <a class="btn" href="javascript:void(0)">검색</a>
        </div>
        <div class="row">
            <label>기본주소</label>
            <input name="addr1" type="text" />
        </div>
        <div class="row">
            <label>상세주소</label>
            <input name="addr2" type="text" />
        </div>

        <!-- 
            === 휴대전화  ===
            select로 앞자리 선택 + input 2개로 나머지 번호 분할 입력 
        -->

        <div class="row">
            <label>휴대전화</label>
            <select>
                <option value="" selected>010</option>
                <option value="">011</option>
            </select>
            <input type="text" />
            <input type="text" />
        </div>

         <!-- 
            === 연락처  ===
            휴대전화와 동일한 select + 분할 입력 패턴 
        -->
        <div class="row">
            <label>연락처</label>
            <select>
                <option value="" selected>053</option>
                <option value="">055</option>
                <option value="">02</option>
            </select>
            <input type="text" />
            <input type="text" />
        </div>

        <!-- 
            === 이메일 ===
            아이디 입력 + 도메인 select 조합 
        -->
        <div class="row">
            <label>이메일</label>
            <input type="text" />
            <select>
                <option value="" selected>@naver.com</option>
                <option value="">@outlook.co.kr</option>
                <option value="">@google.com</option>
            </select>
        </div>

        <!-- 
            === 생년월일 === 
            input type="radio": 같은 name으로 묶여 하나만 선택 가능한 입력 타입
        -->
        <div class="row">
            <label>생년월일</label>
            <input name="birth" value="a" type="radio" /> 양
            <input name="birth" value="b" type="radio" /> 음
        </div>


        <!-- 
            === 연/월/일 === 
            select 연도-월-일 3개로 분리
        -->
        <div class="row">
            <select>
                <option value="" selected>2025</option>
                <option value="">2024</option>
                <option value="">2023</option>
            </select>
            <select>
                <option value="" selected>12</option>
                <option value="">11</option>
                <option value="">10</option>
            </select>
            <select>
                <option value="" selected>01</option>
                <option value="">02</option>
                <option value="">03</option>
            </select>
        </div>
        <hr />

        <!--
            =====================================================
            수신 동의 - checkbox & label for 연결
            =====================================================
            input type="checkbox": 켜기/끄기(on/off) 형태로 선택하는 입력 타입. radio와 달리 독립적으로 각각 체크 가능
            id + label for="id": label의 for 값과 input의 id 값을 일치시켜 두 요소를 연결하는 방식.
            연결되면 label 텍스트를 클릭해도 해당 input이 체크/포커스된다.(클릭 영역 확장)
        -->  
        <div class="row">
            <input id="email-recv" name="email_recv" type="checkbox" />
            <label for="email-recv">이메일 수신에 동의합니다.</label>
        </div>
        <div class="row">
            <input id="sms-recv" name="sms_recv" type="checkbox" />
            <label for="sms-recv">문자메시지 수신에 동의합니다.</label>
        </div>

        <!-- 
            === 제출 버튼  ===
            input type="submit": <button>과 동일하게 form 데이터를 전송하는 입력 타입
        --> 
        <div class="row">
            <input class="btn btn-submit" input type="submit" value="회원가입" />
        </div>

    </form>

</body>

</html>
