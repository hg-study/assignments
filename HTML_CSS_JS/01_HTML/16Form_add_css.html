<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Form</title>
    <!--
        =====================================================
        회원가입 폼 페이지 (CSS스타일 적용)
        =====================================================
        기본 정보 / 닉네임 / 전화번호 / 생일 섹션으로 구성된 회원가입 폼에
        카드형 레이아웃, input/select 공통 스타일, 제출 버튼 스타일을 적용한 페이지
    -->


    <style>

        * {
            box-sizing: border-box; /* padding/border를 width/height 안쪽으로 포함시켜 계산 */
        }


        body {
            margin: 0;   /* 브라우저 기본 여백 제거 */
            padding: 0;
        }
 
        input {
            width: 100%;          /* 부모(.item) 너비만큼 꽉 채움 */
            height: 40px;
            margin-bottom: 10px;  /* 아래 요소와 간격 */
            /* border-radius: 5px; */
            border: 1px solid;
            outline: none;        /* 클릭 시 생기는 기본 테두리 제거 */
            padding-left: 10px;   /* 입력 텍스트가 테두리에 안 붙도록 좌측 여백 */
        }
 
        /* file-selector-button: input[type="file"] 내부의 "파일 선택" 버튼 부분만 선택해 스타일링하는 가상 요소 */
        input[type="file"]::file-selector-button{
            background-color: royalblue;  /* 버튼 배경색 */
            height: 40px;                   /* 옆의 input 높이와 맞춤 */
            color: white;                 /* 버튼 글자색 */
            outline: none;
            border: 0;                      /* 기본 버튼 테두리 제거 */
            width: 100px;
            padding-left: 0;
            padding-right: 0;
        }
 
        select {
            width: 100%;
            height: 40px;
            margin-bottom: 10px;  /* 아래 요소와 간격 */
            /* border-radius: 5px; */
            border: 1px solid;
            outline: none;            
        }
 
        .btn {
            color: white;
            border: 0;
            min-height: 40px;
        }
 
        .btn-submit {
            width: 100%;
            background-color: royalblue;
            cursor: pointer;   /* 마우스 올렸을 때 클릭 가능한 버튼임을 표시 */
        }
 
        .wrapper {
            max-width: 380px;  /* 화면이 넓어도 폼이 이 너비 이상으로 안 늘어남 */
            width: 100%;       /* 화면이 좁으면 화면 너비에 맞춰 줄어듦 */
 
            border: 1px solid;
            margin: 0 auto;    /* 좌우 자동 마진 → 가운데 정렬 */
            padding: 20px;
        }
 
        .wrapper>h2 {}
 
        /* 오타 수정: .wrapper>form> -> .wrapper>form (자식 결합자 뒤 선택자가 비어있던 부분) */
        .wrapper>form {
            width: 100%;
            /* border: 1px solid; */
        }
 
 
        .wrapper>form>.items {
            width: 100%;
            /* border: 1px solid; */
            margin-bottom: 10px;  /* 다음 섹션(.items)과의 간격 */
        }
 
        

    </style>
</head>

<body>
    <div class="wrapper">
        <h2>회원가입</h2>
        <form action="">

            <!-- === 기본 정보 (필수) === -->
            <div class="items">

                <div class="item label">
                    <label>기본 정보</label>
                    <span>필수 사항</span>
                </div>
                <div class="item">
                    <input type="text" placeholder="이메일" />
                </div>
                <div class="item">
                    <input type="password" placeholder="비밀번호" />
                </div>
                <div class="item">
                    <input type="password" placeholder="비밀번호 확인" />
                </div>

            </div>

            <!-- === 닉네임 (선택) === -->
            <div class="items">
                <div class="item label">
                    <label>닉네임</label>
                    <span>선택 사항</span>
                </div>
                <div>
                    <input placeholder="닉네임" />
                </div>
                <div class="item">
                    <input type="file" />
                </div>
            </div>

            <!-- === 전화번호 (선택) === -->         
            <div class="items">
                <div class="item label">
                    <label>전화번호</label>
                    <span>선택 사항</span>
                </div>
                <div class="item phone">
                    <select>
                        <option value="">010</option>
                        <option value="">011</option>
                    </select>
                    <input placeholder="휴대폰 번호를 입력해주세요." />
                </div>
            </div>

            <!-- === 생일 (선택) === -->
            <div class="items">
                <div class="item label">
                    <label>생일</label>
                    <span>선택 사항</span>
                </div>
                <div class="item birth">
                    <select>
                        <option value="">1998</option>
                        <option value="">1999</option>
                    </select>
                    <select>
                        <option value="">1월</option>
                        <option value="">2월</option>
                    </select>
                    <select>
                        <option value="">1일</option>
                        <option value="">2일</option>
                    </select>
                </div>
            </div>

            
            <div>
                <div class="items">
                    <button class="btn btn-submit">회원가입</button>
                </div>
            </div>

        </form>

    </div>
</body>

</html>
