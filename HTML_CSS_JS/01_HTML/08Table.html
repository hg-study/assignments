<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Table실습</title>
    <!--
        =====================================================
        Table - 시맨틱 테이블 구조 (thead / tbody / tfoot)
        <thead>, <tbody>, <tfoot>으로 구분
        =====================================================
    -->
    <style>
        table{
            border-collapse: collapse; /*테두리 선 이중선(기본)제거, 1줄 설정*/
        }
        td,th{
            text-align: center; /* 텍스트 중앙 정렬*/
            width:55px; 
            height:55px;
            border: 1px solid;  /* 테두리 1px 실선 */
        }
        thead{
            background-color: black;
            color:white;
        }
        tbody{
            background-color: orange;
            color:white;
        }
        tfoot{
            background-color: green;
            color:white;
        }
    </style>

</head>

<body>
    <!-- 
        =====================================================
        시맨틱 테이블 구조
        ===================================================== 
 
        [Semantic] thead / tbody / tfoot 
    
        시맨틱(Semantic) 태그는 태그 이름 자체가 콘텐츠의 역할과 의미를 설명한다.
        테이블에서도 영역을 의미 있는 구획으로 나눠 구조적 가독성과 접근성을 높인다.
 
        thead : 테이블의 헤더 영역. 열 이름 등 제목 행을 감싼다. 항상 표의 최상단에 렌더링된다.
        tbody : 테이블의 본문 영역. 실제 데이터 행들을 감싼다.
        tfoot : 테이블의 푸터 영역. 합계, 요약 등 마지막 행을 감싼다. 항상 표의 최하단에 렌더링된다.
 
        코드 상 tfoot을 tbody보다 먼저 작성해도 브라우저는 항상 tfoot을 맨 아래에 표시한다.
        즉, 코드의 위치가 바뀌어도 렌더링 위치는 thead(최상단) → tbody → tfoot(최하단) 순서를 유지한다.

    -->
 
    <!-- thead, tbody, tfoot으로 영역을 나누고 각 영역에 배경색을 적용해 구조를 시각적으로 확인한다. -->
    <table>
        <caption>SEMANTIC</caption>
        <thead> <!-- 테이블 헤더 영역. 최상단, 배경색: black -->
            <tr>
                <th>1열</th>
                <th>2열</th>
                <th>3열</th>
            </tr>
        </thead>
        <tbody> <!-- 테이블의 본문 영역. 배경색: orange -->
            <tr>
                <td>1</td>
                <td>2</td>
                <td>3</td>
            </tr>
        </tbody>
        <tfoot> <!-- 테이블의 푸터 영역. 최하단, 배경색: green -->
            <tr>
                <td>4</td>
                <td>5</td>
                <td>6</td>
            </tr>
        </tfoot>
    </table>
    <hr/>
