<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>List</title>
    <!-- 
        =======================================
        HTML 리스트 태그 - ul, ol, 중첩 리스트
        순서 없는 목록(ul) · 순서 있는 목록(ol) 
        ul + ol 중첩 계층 구조 
        ======================================= 
    -->

</head>
<body>
    
    <!-- 
        ====================================
        리스트 태그 (ul / ol)
        ==================================== 

        HTML 리스트 구조
        리스트 태그는 항목(li)을 감싸는 컨테이너(ul/ol)와 항목 자체(li)로 구성된다.
        ul : Unordered List. 순서 없는 목록. 기본 마커는 점(•)이며 들여쓰기가 자동 적용된다.
        ol : Ordered List. 순서 있는 목록. 기본 마커는 숫자(1, 2, 3...)이다.
        li : List Item. ul 또는 ol의 항목 하나를 나타내는 요소. ul/ol 내부에서만 사용한다.
    -->


    <!-- === [Block] ul - 순서 없는 리스트 === -->
    <!-- ul>li*4{List_$} : Emmet 단축키. li 4개를 List_1~List_4 내용으로 자동 생성한다. -->
    <ul>
        <li>List_1</li>
        <li>List_2</li>
        <li>List_3</li>
        <li>List_4</li>
    </ul>

    <!-- === [Block] ol - 순서 있는 목록 === -->
    <!-- 
        ol   : 순서 있는 목록. type 속성으로 마커 형식을 변경할 수 있다.
        type : 마커 형식 지정 속성
               1 → 숫자 (기본값)  |  a → 소문자 알파벳  |  A → 대문자 알파벳
               i → 소문자 로마 숫자  |  I → 대문자 로마 숫자
    -->

    <ol type="i">
        <li>list_1</li>
        <li>list_2</li>
        <li>list_3</li>
        <li>list_4</li>
    </ol>

    <!-- 
        ====================================
        중첩 리스트 (ul + ol 혼합)
        ==================================== 
 
        li 내부에 또 다른 ul/ol을 삽입하는 방식으로 중첩할 수 있다.
        들여쓰기 depth에 따라 마커 모양이 자동으로 달라진다.
        순서가 있는 세부 항목 → ol 중첩  |  순서 무관한 세부 항목 → ul 중첩
    -->

    <ul>
        <li>
            화면설계
            <!-- ol 중첩: 세부 단계가 순서를 가짐 -->
            <ol>
                <li>요구사항</li>
                <li>유스케이스</li>
                <li>스타일가이드</li>
            </ol>
        </li>
        <li>
            UI디자인
            <!-- ul 중첩: 세부 항목이 순서 무관 -->
            <ul>
                <li>스토리보드</li>
                <li>UI설계</li>
            </ul>
        </li>
        <li>화면구현</li>
        <li>요구사항 확인</li>
        <li>개발 운영 환경 지원</li>
    </ul>


</body>
</html>
