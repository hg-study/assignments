<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>

    <!--
        =====================================================
        회원가입 폼 페이지
        =====================================================
        아이디 / 비밀번호 / 이름 / 주소 / 연락처 / 이메일 / 생년월일 정보를 입력받고,
        수신 동의 체크 후 제출하는 회원가입 폼 페이지
    -->
</head>

<body>
    <!-- 
        form : 사용자로부터 특정정보를 받아 서버로 전달하는데 사용되는 태그
        action Attribute : 전달받는 서버 URI
        method Attribute : 서버로 요청하는 방식
            - GET        : 사용자 요청 정보를 Query String으로 전달(Default)
            - POST       : 사용자 요청 정보를 Request body(Payload) 로 전달
            - PUT        :
            - PATCH      : 
            - DELETE     : 
    -->
    <!--
        =====================================================
        form 태그 & method 속성
        =====================================================
        form : 사용자로부터 특정 정보를 받아 서버로 전달하는 데 사용되는 태그
        action Attribute : 전달받는 서버 URI
        method Attribute : 서버로 요청하는 방식
            - GET    : 사용자 요청 정보를 Query String으로 전달 (Default)
            - POST   : 사용자 요청 정보를 Request body(Payload)로 전달
            - PUT    : 리소스 전체를 새 데이터로 교체(덮어쓰기)할 때 사용
            - PATCH  : 리소스의 일부 데이터만 수정할 때 사용
            - DELETE : 리소스를 삭제할 때 사용
    -->

    <form action="/test.jsp" method="get">

        <!-- 
            === 아이디 중복확인 === 
            (href="javascript:void(0)": 페이지 이동 없이 클릭 이벤트만 발생시키는 더미 링크) 
        -->
        <div>
            <label>아이디</label>
            <input  name="userid"   type="text"  />
            <a href="javascript:void(0)">중복확인</a>
        </div>
        <div>  
            <label>비밀번호</label>
            <input name="password" type="password" />
        </div>
        <div>
            <label>비밀번호 확인</label>
            <input name="re-password" type="password" />
        </div>
        <div>
            <label>이름</label>
            <input name="username" type="text" />
        </div>
        <div>
            <label>우편번호</label>
            <input name="zipcode" type="text" />
            <a href="javascript:void(0)">검색</a>
        </div>
        <div>
            <label>기본주소</label>
            <input name="addr1" type="text" />
        </div>
        <div>
            <label>상세주소</label>
            <input name="addr2" type="text" />
        </div>

        <!-- 
            === 휴대전화  ===
            select로 앞자리 선택 + input 2개로 나머지 번호 분할 입력 
        -->

        <div>
            <label>휴대전화</label>
            <select>
                <option value="" selected>010</option>
                <option value="">011</option>
            </select>
            <input type="text" />
            <input type="text" />
        </div>

        <!-- 
            === 연락처  ===
            휴대전화와 동일한 select + 분할 입력 패턴 
        -->
        <div>
            <label>연락처</label>
            <select>
                <option value="" selected>053</option>
                <option value="">055</option>
                <option value="">02</option>
            </select>
            <input type="text" />
            <input type="text" />
        </div>

        <!-- 
            === 이메일 ===
            아이디 입력 + 도메인 select 조합 
        -->
        <div>
            <label>이메일</label>
            <input type="text" />
            <select>
                <option value="" selected>@naver.com</option>
                <option value="">@outlook.co.kr</option>
                <option value="">@google.com</option>
            </select>
        </div>
      
        <!-- 
            === 생년월일 === 
            input type="radio": 같은 name으로 묶여 하나만 선택 가능한 입력 타입
        -->
        <div>
            <label>생년월일</label>
            <input name="birth" value="a" type="radio" /> 양
            <input name="birth" value="b" type="radio" /> 음
        </div>

        <!-- 
            === 생년월일 === 
            select 연도-월-일 3개로 분리
        -->
        <div>
            <select>
                <option value="" selected>2025</option>
                <option value="">2024</option>
                <option value="">2023</option>
            </select>
            <select>
                <option value="" selected>12</option>
                <option value="">11</option>
                <option value="">10</option>
            </select>
            <select>
                <option value="" selected>01</option>
                <option value="">02</option>
                <option value="">03</option>
            </select>
        </div>
        <hr/>

    </form>


</body>

</html>
