<!DOCTYPE html>

<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Table실습</title>
    <!--
        =====================================================
        Table - 기본 테이블 구조 & rowspan 셀 병합
        <table> 태그로 표 구성, rowspan로 행 병합 실습
        =====================================================
    -->

    <style>
        table{
            border-collapse: collapse;      /* 이중 테두리 제거, 단일선 설정 */
        }
        td,th{
            text-align: center;             /* 텍스트 중앙 정렬 */
            width:55px;
            height:55px;
            border: 1px solid;             /* 테두리 1px 실선 */
        }
        thead{
            background-color: black;       
            color:white;                    
        }
    </style>
    
</head> 
<body>
    <!-- 
        =====================================================
         기본 테이블 구조
        ===================================================== 
   
         HTML에서 표는 <table>을 최상위 컨테이너로 두고, 행과 셀을 중첩해 격자 구조를 만든다.
         <table> : 표 전체를 감싸는 컨테이너. 모든 행과 셀이 이 안에 위치한다.
         <tr>    : Table Row. 표의 가로 한 줄(행)을 정의한다.
         <th>    : Table Header. 열 제목 셀. 기본적으로 굵게(bold), 가운데 정렬로 표시된다.
         <td>    : Table Data. 일반 데이터 셀. 표의 실제 내용을 담는다. -->

    <!-- --- 기본 테이블 --- -->
    <!-- <th>로 헤더 행을 구성하고, 이하 <tr>+<td>로 데이터 행을 3줄 작성한다. -->       
    <table>
        <tr>
            <th>열이름1</th>
            <th>열이름2</th>
            <th>열이름3</th>
        </tr>
        <tr>
            <td>값1</td>
            <td>값2</td>
            <td>값3</td>
        </tr>
        <tr>
            <td>값1</td>
            <td>값2</td>
            <td>값3</td>
        </tr>
        <tr>
            <td>값1</td>
            <td>값2</td>
            <td>값3</td>
        </tr>
    </table>
    <hr/>

    <!-- 
        =====================================================
        rowspan - 행 병합
        ===================================================== 
         rowspan / colspan 속성
         셀 병합은 특정 셀이 여러 행 또는 열을 차지하도록 확장하는 기능이다.
         병합된 자리의 <td>는 작성하지 않는다. 이미 해당 공간을 차지하고 있으므로 작성하면 레이아웃이 밀린다.
 
         rowspan="N"  : 해당 셀을 아래 방향으로 N개 행에 걸쳐 병합한다.
         colspan="N"  : 해당 셀을 오른쪽 방향으로 N개 열에 걸쳐 병합한다. 
         <caption>    : 표의 제목을 정의하는 태그. <table> 바로 아래에 위치하며 표 상단에 표시된다. -->
    
     <table>
        <caption>ROWSPAN</caption>
        <tr>
            <td rowspan="2">1</td>
            <td>2</td>
            <td>3</td>
            <td rowspan="3">4</td>
        </tr>
        <tr>
            <!-- <td>5</td> -->
            <td rowspan="2">6</td>
            <td>7</td>
            <!-- <td>8</td> -->
        </tr>
        <tr>
            <td>9</td>
            <!-- <td>10</td> -->
            <td>11</td>
            <!-- <td>12</td> -->
        </tr>
        <tr>
            <td>13</td>
            <td>14</td>
            <td>15</td>
            <td>16</td>
        </tr>
     </table>

     <hr/>
     
     <table>
        <caption>일반 테이블</caption>
        <tr>
            <td>1</td>
            <td>2</td>
            <td>3</td>
            <td>4</td>
        </tr>
        <tr>
            <td>5</td>
            <td>6</td>
            <td>7</td>
            <td>8</td>
        </tr>
        <tr>
            <td>9</td>
            <td>10</td>
            <td>11</td>
            <td>12</td>
        </tr>
        <tr>
            <td>13</td>
            <td>14</td>
            <td>15</td>
            <td>16</td>
        </tr>
     </table>
        
</body>
</html>
