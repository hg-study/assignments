<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Entity</title>

<!-- 
    ==========================================
    HTML 특수문자 엔티티(Entity) - 브라우저 출력 불가 문자 표현
    HTML에서 예약된 문자나 특수기호를 화면에 표시하기 위한 엔티티 코드
    ==========================================
-->
</head>
<body>

    <!-- 
        ============================
        HTML 엔티티(Entity) 란
        ============================

        HTML 엔티티(Entity)
        HTML은 <, >, & 같은 문자를 태그나 문법 기호로 인식한다. 때문에 이 문자들을 
        화면에 그대로 출력하려면 브라우저가 문자로 해석할 수 있는 특별한 코드로 변환해야 한다.
        이를 HTML 엔티티(Entity)라고 한다.
         
        엔티티 표기 방식은 두 가지다.
        이름 방식  : &엔티티명;   형식 (예: &lt;)
        숫자 방식  : &#숫자코드;  형식 (예: &#60;) 
    -->



    <!-- 
        === 주요 특수문자 엔티티 목록 === 
   
        실제 문자   이름(Entity)    숫자 코드    설명
        <          &lt;            &#60;        less-than (작다)
        >          &gt;            &#62;        greater-than (크다)
        &          &amp;           &#38;        앰퍼샌드 (and 기호)
        "          &quot;          &#34;        큰따옴표
        '          &apos;          &#39;        작은따옴표 (HTML5 이상 지원)
                   &nbsp;          &#160;       non-breaking space (강제 공백)
        ©          &copy;          &#169;       저작권 기호
        ®          &reg;           &#174;       등록상표 기호
        ™          &trade;         &#8482;      상표 기호 
        -->

    <!-- 
        === 공백 엔티티 &nbsp; === 
        HTML은 스페이스를 여러 번 입력해도 화면에는 한 칸만 표시된다.
        &nbsp; : non-breaking space. 강제로 공백 한 칸을 삽입하는 엔티티. 여러 번 연속 사용하면 그만큼 공백이 늘어난다.
        <br>   : 줄 바꿈(Line Break)을 강제하는 빈 요소.
    -->
        
    HELLO&nbsp;&nbsp;&nbsp;&nbsp;WORLD<br/>

    <!-- 
        < > 엔티티 &lt;&gt;
        &lt;, &gt;를 사용해 HTML 태그 기호를 문자 그대로 화면에 출력한다.
        &lt; : less-than.    "<" 기호를 텍스트로 출력하는 엔티티
        &gt; : greater-than. ">" 기호를 텍스트로 출력하는 엔티티 
    -->
     HTML태그 기호 설명: &lt;span&gt;태그는 inline형 태그입니다.
   
</body>
</html>
