<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Img</title>
    <!--
        =====================================================
        Img - 로컬/외부 이미지 삽입 & Base64 인코딩 이미지
        <img> 태그로 이미지 삽입, <a>로 감싸 클릭 시 원본 보기 실습
        =====================================================
    -->
</head>
<body>
    <!--
        =====================================================
        로컬 이미지 - 기본
        ===================================================== 
        src: 표시할 이미지의 경로(파일/URL)를 지정하는 속성
        alt: 이미지를 표시할 수 없을 때 대체 텍스트. 스크린리더(접근성)에도 사용됨 
    -->
    <a href="" target="_blank">
        <img style="border-radius: 50%; width: 150px; height: 150px;" src="./images/dog.jpg" alt="강아지">
    </a>
    
    <hr/>

    <!-- 
        =====================================================
        외부 이미지 - 공개 경로
        ==================================================== 
        외부 도메인의 이미지 경로를 src에 직접 지정. 공개 권한 필요. 해당 서버가 외부 접근(hotlink)을 막아두면 표시되지 않을 수 있음 
    -->

    <a href="" target="_blank">
        <img style="border-radius: 50%; width: 150px; height: 150px;" src="https://catjoa.com/dog_sale/photo/202602/1771412759_97477000_thum.jpg" alt="고양이">
    </a>

    <!--
        =====================================================
        Base64 Encoding Img
        =====================================================
        이미지 파일을 문자열(Base64)로 변환해 src에 직접 삽입하는 방식
        장점: 문자열이므로 별도의 이미지 파일 없이도 표시 가능
        단점: 문자열 길이가 매우 길어져 HTML 파일 용량이 커짐 
    -->

    <img src="링크">
</body>
</html>
