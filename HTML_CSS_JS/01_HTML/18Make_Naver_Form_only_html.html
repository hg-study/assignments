<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NAVER</title>
    <!--
        =====================================================
        NAVER 회원가입 폼 페이지
        =====================================================
        실명 인증 체크 / 아이디&비밀번호&이메일 / 이름&생년월일&성별&휴대전화 
        섹션으로 나뉜 네이버 회원가입 폼 구성 실습 페이지
    -->
</head>
<body>
    
    <div class="wrapper">

        <div>
            <h2>NAVER</h2>
        </div>

        <form action="">
            
            <!-- === 실명 인증 체크박스 (form-header) === -->
            <div>
                <label>실명 인증된 아이디로 가입</label>
                <input type="checkbox">
            </div>
            
            <!-- === 아이디 / 비밀번호 / 이메일 (form-main-section-01) === -->
            <div>

                <div>
                    <label>아이디</label>
                    <input type="text" name="userid" />
                </div>

                <div>
                    <label>비밀번호</label>
                    <input type="password" name="password" />
                </div>         
                <!--
                    === 이메일 ===
                    input type="email": 이메일 형식(@포함)을 자동 검증하는 입력 타입.
                    type="text"와 다르게 형식이 맞지 않으면 submit 시 브라우저가 자동으로 에러를 띄운다
                -->
                <div>
                    <label>이메일</label>
                    <input type="email" name="email" />
                </div>    
        
            </div>

            <!-- === 이름 / 생년월일 / 성별 / 국가 / 휴대전화 (form-main-section-02)  === -->
            <div>

                <div>
                    <label>이름</label>
                    <input type="text" name="username" />
                </div>
                <div>
                    <label>생년월일 8자리</label>
                    <input type="text" name="birthday" />
                </div>

                <!-- 
                    === 성별 radio ===
                    같은 name="gender"로 묶어 하나만 선택되도록 처리  
                 -->

                <!-- <div style="display:flex"> --> <!-- 하면 1줄 처리 -->
                <div>
                    <div>
                        <label>남자</label>
                        <input type="radio" name="gender" />
                    </div>
                    <div>
                        <label>여자</label>
                        <input type="radio" name="gender" />
                    </div>
                    <div>
                        <label>선택안함</label>
                        <input type="radio" name="gender" />
                    </div>
                </div>

                <div>
                    <label>국가번호</label>
                    <select>
                        <option value="82" selected>대한민국 +82</option>
                    </select>
                </div>
                <div>
                    <label>전화번호</label>
                    <input type="text" name="phone" />
                </div>

            </div>

            <!-- === form-footer === -->
            <div>

                <!--
                    =====================================================
                    button vs input type="submit"
                    =====================================================

                    둘 다 form 제출 버튼이지만 스타일 자유도가 필요하면 button, 
                    단순 제출 버튼이면 둘 중 뭘 써도 무관하다.

                    <button>: 텍스트, 이미지 등 HTML 요소를 넣을 수 있으며,
                    form 안에서는 기본 type이 submit이다.

                    <input type="submit">: value로 버튼 텍스트를 지정하며,
                    HTML 요소는 넣을 수 없다.
                -->
                <button>인증요청</button>
                <input type="submit" value="인증요청" />
            </div>

        </form>

    </div>

</body>
</html>
