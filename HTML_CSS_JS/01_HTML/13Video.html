<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Video</title>
    
    <!--
        =====================================================
        배경 동영상 재생 페이지
        화면 전체를 채우는 배경 동영상을 자동 재생시키고,
        상단에 그라데이션 오버레이를 겹치는 페이지
        =====================================================        
    -->

    <style>
        body{
            margin: 0;   /* 기본 여백 제거 */
            padding: 0;  /* 기본 내부 여백 제거 */
        }
        .bg-video{
            position: fixed;   /* 뷰포트 기준 고정 배치. 스크롤해도 위치 유지 */
            left: 0;
            top: 0;
            width: 100vw;     
            height: 100vh;
            z-index: -2;       /* 다른 요소들보다 뒤쪽(배경)에 배치 */
        }
 

        .bg-video>video{
            width: 100%;
            height: 100%;
            object-fit: cover; /* contain */
        }

        .gradient-overlay{
            position:fixed;
            left:0;
            top:0;
            width:100vw;
            height: 20%;
            background: linear-gradient(to bottom, rgba(137, 186, 219, 0.699), rgba(0, 0, 0, 0)); /* 위->아래로 옅어지는 그라데이션 */
        }

    </style>
</head>
<body>
    <!--
        =====================================================
        video 태그 옵션 & MIME TYPE
        =====================================================
        autoplay: 자동 재생
        muted: 음소거
        loop: 반복 재생
        controls: 하단 제어부 표시 여부
 
        MIME TYPE: Client - Server 간 자료(보통 파일)를 교환할 때 사용되는 표준화된 식별자
        type/subtype 형식으로 구성된다
        type: text, image, video, application
        subtype: html, png, mp4, pdf...
    -->

    <div class="wrapper">
        <div class="gradient-overlay"></div>
        <div class="bg-video">
            <video autoplay muted loop>
                <source src="../../.github/images/HTML_CSS_JS/video.mp4" type="video/mp4" />
            </video>
        </div>
    </div>

</body>
</html>
